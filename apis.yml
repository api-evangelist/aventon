name: Aventon
description: >-
  Aventon is a consumer electric bicycle (e-bike) manufacturer headquartered in
  Brea, California. Founded in 2012 and originally known for fixed-gear and track
  bikes, the company pivoted to electric bikes and is now one of the larger
  direct-to-consumer e-bike brands in the United States, with a lineup that spans
  commuter, fat-tire, lightweight, folding, cargo, and mountain e-bikes sold
  online and through a dealer network. Aventon operates no traditional public
  developer API of its own, but its Shopify-powered storefront at aventon.com
  natively exposes agent-facing commerce surfaces: a published /llms.txt, Shopify
  Customer Account OpenID Connect discovery, and a live Universal Commerce
  Protocol (UCP) MCP endpoint for agent-driven catalog search, cart, and checkout.
